# Domain keys group routing budgets; they do not prove independent infrastructure or capacity.
# OpenRouter (Igor, 2026-10-07): only free models are used, as the last fallback step when
# paid rungs are exhausted. Free models change often; the PR desk watchdog and its drift
# check compare this list with OpenRouter's live model list. Paid OpenRouter models: none;
# a paid model needs its own domain with a distinct model_prefix and Igor's explicit decision.
domains:
  # Igor 2026-10-18 (ASMA-8535): each OpenCode service has its own alias, so a quota limit on one never blocks the others.
  openrouter-free: { provider: opencode, accounts: [opencode-openrouter], model_prefix: "openrouter/" } # free models only (ids end in :free)
  claude:     { provider: claude,   accounts: [claude-b, claude-a] }   # exact aliases only; never the bare `claude` login. Work first (Igor, 2026-09-25)
  codex:      { provider: codex,    accounts: [codex-b, codex-a] }
  cursor:     { provider: cursor,   accounts: [cursor] }
  deepseek:   { provider: opencode, accounts: [opencode-deepseek], model_prefix: "deepseek/" }
  # Z.AI Coding Plan: its own subscription (ASMA-8373, 2026-10-06), reached through OpenCode under its own alias.
  zai:        { provider: opencode, accounts: [opencode-zai], model_prefix: "zai-coding-plan/" }

# For providers that do not work at all. Quota exhaustion needs no entry.
unavailable:
  domains: []                     # deepseek removed: Igor 2026-10-06 (ASMA-8371 DEC-014); OpenRouter is available (Igor 2026-10-07)
  accounts: []                    # claude-b back 2026-09-25 (Igor checked; operator quota record rev 273)

