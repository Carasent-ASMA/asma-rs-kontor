[package]
name = "kontor-tests-contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Kontor workspace contract test crate."

[lints]
workspace = true

[[test]]
name = "runtime_adapter"
path = "runtime_adapter.rs"

[[test]]
name = "profiles_teams"
path = "profiles_teams.rs"

[[test]]
name = "guardrails"
path = "guardrails.rs"

[[test]]
name = "scheduling"
path = "scheduling.rs"

# KON-MVP-16: the API-to-MCP parity oracle and the thin-wrapper mutant suite.
# They live here rather than in `kontor-mcp` for a reason the dependency audit
# depends on: the oracle needs the generated contract from `kontor-api`, and
# `kontor-api` reaches SQLite. Keeping them out of that crate is what lets
# `cargo tree -p kontor-mcp` stay free of the store in every edge kind, dev
# dependencies included.
[[test]]
name = "mcp_parity"
path = "mcp_parity.rs"

[[test]]
name = "mcp_cardinality"
path = "mcp_cardinality.rs"

[[test]]
name = "mcp_mutants"
path = "mcp_mutants.rs"

[dependencies]
# KON-MVP-05/KON-MVP-12: the reusable, capability-aware contract harness lives in
# `src/lib.rs` so a real adapter crate can run the *same* assertions as the
# scripted fake instead of copying them. That library target needs the port and
# the domain types the contract is stated in as normal dependencies; the test
# targets below pick them up through it. No adapter crate is a dependency here:
# the harness is stated against `RuntimeAdapter`, never against a provider.
kontor-core = { path = "../../crates/kontor-core", version = "=0.2.0" }
kontor-runtime = { path = "../../crates/kontor-runtime", version = "=0.2.0" }

[dev-dependencies]
# KON-MVP-08: the profiles/teams contract exercises the sealed slot API against
# the real store and the same scripted fake, rather than against mock sessions.
kontor-profiles = { path = "../../crates/kontor-profiles", version = "=0.2.0" }
kontor-policy = { path = "../../crates/kontor-policy", version = "=0.2.0" }
# KON-MVP-09: the scheduling contract runs the real pass over what the real store
# holds, so the seam between deciding and committing is proved rather than assumed.
kontor-scheduler = { path = "../../crates/kontor-scheduler", version = "=0.2.0" }
kontor-store = { path = "../../crates/kontor-store", version = "=0.2.0" }
kontor-teams = { path = "../../crates/kontor-teams", version = "=0.2.0" }
# KON-MVP-16: the two sides the parity oracle compares — the generated contract
# and the tool registry — plus the daemon, for the constants `kontor-mcp` must
# restate because it may not link it.
kontor-api = { path = "../../crates/kontor-api", version = "=0.2.0" }
kontor-mcp = { path = "../../crates/kontor-mcp", version = "=0.2.0" }
kontor-daemon = { path = "../../crates/kontor-daemon", version = "=0.2.0" }
jiff = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
insta = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
wiremock = { workspace = true }
