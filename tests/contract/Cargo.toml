[package]
name = "kontor-tests-contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Kontor workspace contract test crate."

[lints]
workspace = true

[[test]]
name = "runtime_adapter"
path = "runtime_adapter.rs"

[[test]]
name = "profiles_teams"
path = "profiles_teams.rs"

[[test]]
name = "guardrails"
path = "guardrails.rs"

[dependencies]
# KON-MVP-05/KON-MVP-12: the reusable, capability-aware contract harness lives in
# `src/lib.rs` so a real adapter crate can run the *same* assertions as the
# scripted fake instead of copying them. That library target needs the port and
# the domain types the contract is stated in as normal dependencies; the test
# targets below pick them up through it. No adapter crate is a dependency here:
# the harness is stated against `RuntimeAdapter`, never against a provider.
kontor-core = { path = "../../crates/kontor-core", version = "=0.1.0" }
kontor-runtime = { path = "../../crates/kontor-runtime", version = "=0.1.0" }

[dev-dependencies]
# KON-MVP-08: the profiles/teams contract exercises the sealed slot API against
# the real store and the same scripted fake, rather than against mock sessions.
kontor-profiles = { path = "../../crates/kontor-profiles", version = "=0.1.0" }
kontor-policy = { path = "../../crates/kontor-policy", version = "=0.1.0" }
kontor-store = { path = "../../crates/kontor-store", version = "=0.1.0" }
kontor-teams = { path = "../../crates/kontor-teams", version = "=0.1.0" }
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
insta = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
wiremock = { workspace = true }
