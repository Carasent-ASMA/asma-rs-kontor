    team/01936f5a-0000-7000-8000-000000000102/verify: team/01936f5a-0000-7000-8000-000000000102/implement
    team/01936f5a-0000-7000-8000-000000000102/audit: team/01936f5a-0000-7000-8000-000000000102/implement
