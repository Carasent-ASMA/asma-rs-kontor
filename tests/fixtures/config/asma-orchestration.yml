# ASMA's values as the schema's test case. This is test data, not a live config
# folder: the paths below describe the declared asma-modules and
# asma-rs-kontor checkouts. The schema test asserts that the same project: block
# accepts a concrete project as well as the neutral example.
schema_version: 1
fleet: orchestration/fleet.yml
core_team: orchestration/teams/core-team.yml

project:
  key: ASMA
  name: ASMA
  owner: platform owner
  resource_roots:
    modules: Carasent-ASMA/asma-modules
    kontor: Carasent-ASMA/asma-rs-kontor
  decision_authorities:
    platform: platform owner
    architecture: Architecture Review
    decision_records_root: modules/_docs/adr/
  tracker:
    kind: jira
    site: https://carasent.atlassian.net
    project_key: ASMA
    key_pattern: '^ASMA-[0-9]+$'
    credential_alias: jira-api-token
    spec: tracker/jira.yml
  branch:
    types: [feat, fix, docs, refactor, test, chore, ci, build, perf]
    pattern: '^(feat|fix|docs|refactor|test|chore|ci|build|perf)/ASMA-<number>-<slug>$'
    commit_pattern: '^ASMA-<number> <summary>$'
  forge:
    kind: github
    organization: Carasent-ASMA
    repositories:
      - Carasent-ASMA/asma-modules
      - Carasent-ASMA/asma-rs-kontor
    base_branch: master
  runtime:
    matrix:
      - {name: claude, harness: paseo, provider: claude}
      - {name: codex, harness: paseo, provider: codex}
      - {name: cursor, harness: paseo, provider: cursor}
      - {name: opencode, harness: opencode, provider: opencode}
  cli:
    command: asma
    verbs: [status, epic, task, git, fleet]
  team_pack: packs/team.yml
  fleet: orchestration/fleet.yml
  supervision: orchestration/tpm-supervision.yml
  pr_desk:
    command: python3 _tools/ai-orchestration/pr_desk.py
    settings: orchestration/pr-desk.yml
    history_root: pr-review
  merge_authority:
    role: platform owner
    policy: independent-review-then-owner
  documentation_roots: [modules/_docs, kontor/docs]
  gap_ledger: modules/_docs/ai-orchestration/index.md
  attention_channel: 'desk:adam'
  glossary: modules/UBIQUITOUS_LANGUAGE.md
  worktree_layout: '.worktrees/<key-slug>/<module>'
  check_runs: [asma/publication-branch-title, asma/publication-identity]
  capacity:
    max_delivery_seats: 2
    max_parallel_tasks: 7
    start_admission: 4
  time_zone: Europe/Oslo
  holiday_countries: [NO]
  currency: NOK
