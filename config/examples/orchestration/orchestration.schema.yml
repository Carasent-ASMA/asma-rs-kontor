# Machine-readable companion to the `project:` block documented in
# docs/CONFIGURATION.md. It states required key presence plus the named
# cross-field rules; the schema tests in
# crates/kontor-fleet/tests/config_examples.rs prove those against both the
# neutral example and ASMA's concrete values.
schema_version: 1
kind: kontor-orchestration-project
description: The project parameter block of orchestration.yml.

required:
  - schema_version
  - fleet
  - core_team
  - project

project:
  required:
    - key
    - name
    - owner
    - resource_roots
    - decision_authorities
    - tracker
    - branch
    - forge
    - runtime
    - cli
    - team_pack
    - fleet
    - supervision
    - pr_desk
    - merge_authority
    - documentation_roots
    - gap_ledger
    - attention_channel
    - glossary
    - worktree_layout
    - check_runs
    - capacity
    - time_zone
    - holiday_countries
    - currency
  optional: [project_id, publication]
  nested:
    decision_authorities:
      required: [platform, architecture, decision_records_root]
    tracker:
      required: [kind, site, project_key, key_pattern, credential_alias, spec]
    branch:
      required: [types, pattern, commit_pattern]
    forge:
      required: [kind, organization, repositories, base_branch]
    runtime:
      required: [matrix]
    cli:
      required: [command, verbs]
    pr_desk:
      required: [command, settings, history_root]
    merge_authority:
      required: [role, policy]
    capacity:
      required: [max_delivery_seats, max_parallel_tasks, start_admission]
      rule: max_parallel_tasks and start_admission are the Paseo-direct placement capacity ceiling and initial admission; start_admission must be <= max_parallel_tasks; max_delivery_seats is an owner-set project value scoped per team run, not supplied by the placement rule, not a global team-run ceiling, and kontord has no such field

publication_contract:
  presence: project_id and publication are either both absent or both present
  absent: direct-only startup is valid; no publication authority is configured
  project_id: an explicit internal Kontor ProjectId UUIDv7, never inferred from a tracker key, name, path or App
  required: [root_repository, module_repositories]
  repositories: every value is an exact validated entry in project.forge.repositories; membership alone grants no access
  modules: exact durable Task.module ModuleKeys; no duplicates, wildcards, aliases, prefixes or path guesses; an empty mapping is valid
  task_scope: configured root plus only the exact stored task module mapping
  epic_scope: configured root plus the union for that epic's own stored tasks
  base_branch: project.forge.base_branch, without a fallback
  integrations: declared Kontor project_id values in the selected tracker or App must agree with project.project_id; they never supply authority
  runtime: require the requested ProjectId to match the activated policy and an existing Project in the same realm; config loading never creates a Project
  activation: the existing immutable bundle manifest pins the resolved policy and source hashes; authoring edits or unactivated publications never replace authority

branch_contract:
  types: a nonempty unique subset of kontor-core BranchType, in declared order
  pattern: anchored `^(type|type)/<KEY>-<number>-<slug>$`, with the declared types in order; a literal matching project.key is also valid
  commit_pattern: anchored `^<KEY>-<number> <summary>$`, or the matching literal project.key
  rule: templates narrow the shared grammar; arbitrary regexes and cross-project literals refuse by field name
  publication: rules are pinned with publication policy in the activated bundle; confirmed task/epic binding remains required
  commit_evidence: the commit template is validated and pinned; a head SHA alone does not prove a commit message

# The two supervision files are distinct contracts.
supervision_contract:
  project.supervision: folder-relative autonomous_tpm_v1 TPM cadence profile, read from the selected config folder
  paseo_watchdog: paseo-supervision.yml in the selected folder, read by the Paseo watchdog and recovery path; it is not a project key

# The PR desk contract. The project block owns the invocation, the pinned
# policy file name and the data-root-relative history root; the host owns an
# optional absolute override, and the desk's explicit environment override
# ranks above it.
pr_desk_contract:
  project.pr_desk:
    command: the command line that invokes the project's PR desk
    settings: the pinned folder-relative orchestration/pr-desk.yml, read from the selected config folder
    history_root: relative to host.paths.data_root; the root is resolved by learning_log_root below
  learning_log_root:
    precedence:
      - 'PR_DESK_DIR: the explicit desk host override, highest precedence'
      - 'host.paths.pr_desk: an absolute history root in host bootstrap data'
      - '<host.paths.data_root>/<project.pr_desk.history_root>: the project default'
    resolved_log: '<resolved root>/learning.log; there is no second candidate'
  settings_file:
    name: orchestration/pr-desk.yml
    required: [schema_version, poll_start_budget, active_pr_policy, ready_silence_days, draft_silence_days, fix_round_limit, revise_round_limit]
    active_pr_policy_values: [unlimited, one_active]
    extra_keys: allowed; project-owned keys may sit beside the required seven
    rule: poll_start_budget, the silence days and both round limits are positive integers

# Path classes. Only config_file_references are contained by the selected
# config folder; project resource paths belong to the project root, and host
# paths belong to this machine.
paths:
  config_file_references:
    base: selected config folder
    rule: relative, contained, must exist
    keys:
      - fleet
      - core_team
      - project.team_pack
      - project.fleet
      - project.supervision
      - project.tracker.spec
      - project.pr_desk.settings
  project_resource_paths:
    base: a declared project.resource_roots entry
    rule: the first path segment is a resource-root key; it maps to a repository in project.forge.repositories, and the rest resolves inside that checkout. Absolute paths and `..` segments are refused.
    roots_key: project.resource_roots
    keys:
      - project.documentation_roots
      - project.gap_ledger
      - project.glossary
      - project.decision_authorities.decision_records_root
  host_data_relative_paths:
    base: host.paths.data_root
    rule: relative and contained; absolute paths and `..` segments are refused; the learning log is <history_root>/learning.log
    keys:
      - project.pr_desk.history_root
  host_paths:
    base: host filesystem
    rule: absolute or PATH-resolved host state; not a config reference
    keys:
      - host.paths.*
      - host.binaries.*
      - host.project_cli.*
      - host.checkouts.root.path
      - host.checkouts.modules.<Task.module>.path
  conventions:
    project.worktree_layout: an exact relative pattern with a literal managed root and exactly one whole <key-slug> and <module> segment; no unknown placeholders, absolute paths or traversal; not a resolved path

# Host checkout sources constrain Git input identity, never publication authority.
task_checkout_sources:
  source: host.yml
  key: checkouts
  presence: optional for empty/direct-only startup; omission disables managed task source selection without fallback
  required_fields: [root, modules]
  root: explicit source whose canonical checkout root equals durable Project.root_path
  modules: exact canonical Task.module keys; no wildcard, basename, prefix or resource-root mapping; empty mapping is valid
  record:
    required_fields: [repository, path, base_ref]
    repository: exact validated project.forge.repositories member; grants no publication permission
    path: absolute canonical existing working-checkout root; parent Git discovery is refused
    base_ref: explicit refs/heads/<project.forge.base_branch> or refs/remotes/<configured-remote>/<project.forge.base_branch>; resolve exact ref to a direct commit
  selection: exact module record wins; otherwise root only for a normal tracked place at the pinned base with no gitlink, symlink or nested repository boundary; missing or inconclusive places need an exact record
  root_only: root source plus the existing explicitly declared durable task worktree; no invented module or destination
  destination: project.worktree_layout renders full durable Task.module and confirmed tracker key; existing destinations prove exact root, same Git common directory, confirmed branch and task ownership
  snapshot: derive an undeclared module claim only after durable tracker confirmation; freeze the first claim and source record, canonical common directory, exact base ref and commit atomically before Git; retries preserve the snapshot and confirmed bindings only verify readback
  changes: host input is bootstrap-bound; later edits cannot change existing placements; guarded correction freezes the replacement source atomically with its exact claim
  remote_task_branch: no implicit remote fallback; explicit input required
  consultation: unchanged existing consultation_root consumer; not a Task.module layout or source consumer

# The fleet/host join. The fleet owns canonical model/vendor/effort policy; the
# host owns the working provider/harness/account route. The logical slot is the
# join key, and the canonical model name is the compatibility key.
route_binding:
  slot_universe: fleet.domains.<domain>.accounts[]
  host_slot: host.provider_accounts.<slot>
  host_order: host.routes.<domain>[]
  join_key: slot
  canonical:
    owner: fleet
    fields: [model_id, vendor, efforts, chains, bindings]
    note: domains.<domain>.provider is the canonical/native family, not a host restriction
  host_route:
    fields: [provider, harness, native_alias, credential, serves, efforts, qualification]
    serves: mapping from canonical fleet model name to the model id this route launches (route_model_id); without a qualification it must equal models.<model>.id
    efforts: optional subset of the fleet model's efforts
    qualification: reference `<route>@<revision>`; required when provider differs from the fleet domain provider or the route-native launch id differs from the canonical model id
  runtime_matrix:
    owner: project
    rule: project.runtime.matrix is an allowlist of provider/harness pairs; a host route not listed is refused before placement
  qualification:
    source: orchestration/route-qualifications.yml
    activation: a generated activation record names this source, its exact SHA-256 source_hash and activated_at; the authored source carries no activation flag
    activation_record_fields: [schema_version, source, source_hash, activated_at]
    record_fields: [route, harness, model, canonical_model_id, canonical_vendor, route_model_id, efforts, revision, record_hash]
    record_hash: SHA-256 over ordered key=value lines joined by newlines with no trailing newline, listing route, harness, model, canonical_model_id, canonical_vendor, route_model_id, efforts (declared order, comma-separated), revision
    rule: the activation source_hash must match the exact file bytes and the record must hash-match and cover the pinned canonical identity, route-native launch id and effort; `<route>@<revision>` is split exactly and compared for equality
  compatibility:
    rule: the route maps the canonical model to a route-native id in serves and supports the pinned effort; a different launch id or a cross-provider route needs a matching activated qualification record
    refusal: an unproven or malformed cross-provider route, or a same-provider route that changes the launch id without proof, is refused with route_model_id_unproven, route_unqualified or route_qualification_*; a different provider is never substituted merely because it is available
    fleet_edit: a host route change never requires a fleet policy edit
  fallback: skip an incompatible route, continue routes.<domain>, then descend to the next chain step; never change the canonical model or effort to fit a route; a fallback never lands on a vendor excluded by rules.independent_of
  vendor_independence: the canonical fleet vendor, not the working provider or harness; if no route preserves it, placement is refused
  migration: schema_version 2 accounts become logical slots; legacy native aliases map to host routes; active-run snapshots are preserved; the current bundle base config/orchestration/ moves to the selected-folder root with manifest-name equivalence; no daemon change before KR-14

# A placement freezes this record. A later host edit changes new placements,
# never the snapshot an active run already holds.
route_snapshot:
  fields:
    - policy_hash
    - host_route_hash
    - slot
    - route_provider
    - route_harness
    - native_alias
    - qualification
    - route_model_id
    - canonical_model
    - canonical_effort
    - canonical_vendor
    - resolved_at

# Tracker documents are authoring candidates; explicit Admin installation
# publishes their immutable revisions into the selected realm/project.
tracker_specs:
  manifest: project.tracker.spec
  required: [schema_version, kind, project_key, specs]
  schema_version: 1
  kind: jira
  specs:
    entry_required: [kind, path]
    kind_values: [ticket_fields, external_workflow]
    path: folder-relative existing YAML file, contained after symlink resolution
  constraints:
    - project_key equals project.key
    - exactly one declared external project across the selected specs
    - duplicate type/connector/external-project/issue-type/version selectors refuse
    - loading installs nothing; omission or an empty list has no bundled fallback
    - installation binds workflow and matching field hashes in one Admin receipt
    - installed immutable bytes govern until explicitly installed policy changes

# The selected pack is authoring; existing publication/apply paths remain the writer.
team_pack:
  manifest: project.team_pack
  schema_version: 1
  required: [schema_version, profile_pack, operational_domain, committee_presets]
  extra_keys: refused
  references: contained existing YAML files relative to the selected folder root
  validation: existing typed profile/team/domain/preset schemas plus logical-role delivery correspondence
  read: exact source hashes cached at startup; no hot-read or installation
  absent: empty/direct-only daemon startup may omit the pack; no compiled profile/preset fallback
  profiles: selected candidates and explicitly registered packs; stored revisions and run pins govern execution
  selected_team_authority: registered input; never compiled-seed revision reconciliation
  committees: explicit existing preview/apply; reading a catalog or restarting publishes nothing
  domain: candidate validation here; runtime authority requires resolved frozen Core Team purposes
