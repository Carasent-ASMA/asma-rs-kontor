# Neutral quota-signals example. It shows the document shape and the fields a
# deployment must supply; the markers below are deliberately fake and match no
# real vendor message. Copy it into the selected config folder (or a Realm's
# state root, while the old layout is still read) and replace every marker with
# the vendor wording captured from that deployment.
#
# A signal is applied only to the account alias it names. Order matters: the
# first signal whose markers all appear wins, so a more specific vendor wording
# must precede a more general one. A credit balance carries no reset fields.
schema_version: 1

signals:
  - id: example-claude-allowance
    version: 1
    provider: claude-primary
    basis: plan_allowance
    markers:
      - example spend limit
      - example.invalid/settings/usage
      - your session limit resets
    reset_prefix: 'your session limit resets '
    reset_zone: Europe/Oslo

  - id: example-codex-allowance
    version: 1
    provider: codex-primary
    basis: plan_allowance
    markers:
      - '[system error]'
      - example usage limit
      - example.invalid/codex/settings/usage
      - try again at
    reset_prefix: 'try again at '
    reset_zone: Europe/Oslo

  - id: example-opencode-credits
    version: 1
    provider: opencode
    basis: credit_balance
    markers:
      - insufficient
      - credits
