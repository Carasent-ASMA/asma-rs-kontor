[package]
name = "kontor-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "SQLite repositories, migrations and event append/replay for the Kontor control plane."

[lints]
workspace = true

[dependencies]
# The exact version is the workspace's own package version. A bare path
# dependency is a wildcard requirement, which `deny.toml` refuses.
kontor-core = { path = "../kontor-core", version = "=0.1.0" }
# KON-MVP-10: guardrail verdicts and the recovery state machine are decided in
# `kontor-policy` and only *recorded* here, so this crate depends on the decision
# types and never re-implements a rule.
kontor-policy = { path = "../kontor-policy", version = "=0.1.0" }
# KON-MVP-09: the ready-batch decision is made in `kontor-scheduler`; this crate
# makes one of those decisions durable and never re-decides it. Same split as
# `kontor-policy` above.
kontor-scheduler = { path = "../kontor-scheduler", version = "=0.1.0" }
# KON-MVP-21: a candidate's calendar answer is resolved in `kontor-calendar` from
# rows this crate reads. Assembling a snapshot is this crate's job; deciding what
# a window, a holiday or an override means is not, and re-deriving it here would
# be the second resolver the whole design exists to avoid.
kontor-calendar = { path = "../kontor-calendar", version = "=0.1.0" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Integration tests assert schema inventory, trigger behaviour and immutability
# through direct SQL, which the public store API deliberately does not expose.
rusqlite = { workspace = true }
tempfile = { workspace = true }
# KON-MVP-09: the lease suite injects its clock, so it needs to say "five minutes
# after the fixture instant" rather than parse a second literal for every step.
jiff = { workspace = true }
serde_json = { workspace = true }
# KON-MVP-10: the guardrail suite builds the verdicts it stores with the same
# types the evaluator produces, rather than hand-rolling look-alike rows.
kontor-policy = { path = "../kontor-policy", version = "=0.1.0" }
# KON-MVP-19: the export/import suite seeds the specifications a real deployment
# has, from the bundled pack, because the import path re-validates them through
# the same domain types — a hand-rolled document would test a shape nobody runs.
kontor-profiles = { path = "../kontor-profiles", version = "=0.1.0" }
# KON-MVP-22: the intake suite assembles a real scheduling snapshot to prove what
# crosses the boundary, and a snapshot names the runtime capability vocabulary.
kontor-runtime = { path = "../kontor-runtime", version = "=0.1.0" }
