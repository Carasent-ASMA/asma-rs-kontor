[package]
name = "kontor-accounts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Non-secret account profiles, credential references and routing."

[lints]
workspace = true

[dependencies]
# The exact version is the workspace's own package version. A bare path
# dependency is a wildcard requirement, which `deny.toml` refuses.
kontor-core = { path = "../kontor-core", version = "=0.2.1" }
# For the capability preflight only: an account-pinned launch is refused by the
# runtime contract's own gate, never by a second copy of it in this crate.
kontor-runtime = { path = "../kontor-runtime", version = "=0.2.1" }
# The adaptive window's arithmetic — how wide, how it clamps, what one growth
# step adds — stays the scheduler's. This crate owns only the transition: which
# observation moves the window, and when.
kontor-scheduler = { path = "../kontor-scheduler", version = "=0.2.1" }
serde = { workspace = true }
serde_json = { workspace = true }
# The quota-signals document is YAML for the same reason `supervision.yml`
# is: an operator edits it by hand. Already a workspace dependency.
serde_yaml_ng = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
jiff = { workspace = true }
thiserror = { workspace = true }

# macOS reads the keychain through `/usr/bin/security` instead, so that a grant
# survives a rebuild of this ad-hoc-signed binary — see `SystemKeychain`.
[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { workspace = true }

[dev-dependencies]
# The security suite proves the *persisted* bytes carry no credential material,
# which needs the real store and a real database file rather than a stub.
kontor-store = { path = "../kontor-store", version = "=0.2.1" }
rusqlite = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
