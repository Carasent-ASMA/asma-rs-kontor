[package]
name = "kontor-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The kontor command-line interface."

[lints]
workspace = true

[[bin]]
name = "kontor"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
# KON-MVP-16: the command surface *is* the MCP tool registry. Depending on it is
# what stops this crate growing a second route table; it also brings the one
# loopback client and the one dispatch path, so a shell call and a tool call are
# the same code below the argument parser.
kontor-mcp = { path = "../kontor-mcp", version = "=0.2.0" }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
kontor-api = { path = "../kontor-api", version = "=0.2.0" }
kontor-core = { path = "../kontor-core", version = "=0.2.0" }
kontor-daemon = { path = "../kontor-daemon", version = "=0.2.0" }
kontor-store = { path = "../kontor-store", version = "=0.2.0" }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
