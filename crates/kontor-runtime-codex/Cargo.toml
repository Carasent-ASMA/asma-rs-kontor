[package]
name = "kontor-runtime-codex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Narrow direct Codex account-isolation fallback adapter."

[lints]
workspace = true

[dependencies]
# The exact version is the workspace's own package version. A bare path
# dependency is a wildcard requirement, which `deny.toml` refuses.
kontor-core = { path = "../kontor-core", version = "=0.2.1" }
kontor-runtime = { path = "../kontor-runtime", version = "=0.2.1" }
# KON-MVP-07's admission and resolver, reused rather than reimplemented: this
# adapter owns no credential resolution of its own. It never sees a secret value
# — `ResolvedAccountEnvironment::apply` writes straight into the child's
# environment block — and the one value it reads back is the config home it is
# about to hand the child, so it can verify the non-secret marker inside it.
kontor-accounts = { path = "../kontor-accounts", version = "=0.2.1" }
async-trait = { workspace = true }
# The usage probe's transport. Already pinned at the workspace root and used by
# other members, so this adds a member edge rather than a new dependency: the
# pre-flight quota read is one authenticated GET, and hand-rolling TLS and JSON
# for it would be a far larger surface than the one call it makes.
reqwest = { workspace = true }
# The usage token is the one credential this crate holds. `SecretString` zeroizes
# it on drop, which is the same discipline `kontor-accounts` applies to a
# resolved credential.
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

# There is deliberately no PTY, terminal or WebSocket dependency here. Codex is
# driven as a one-shot `codex exec --json` child process over piped stdout, which
# `tokio`'s already-pinned `process` feature covers completely — so unlike
# `kontor-runtime-ao` and `kontor-runtime-paseo`, this adapter's live transport
# is whole rather than gated behind a dependency the root manifest does not
# carry.

[dev-dependencies]
# The capability-aware shared contract, so this adapter is judged by the same
# assertions as the scripted fake and its sibling adapters rather than by a copy
# of them. The dependency runs test-crate -> adapter only in this direction.
kontor-tests-contract = { path = "../../tests/contract", version = "=0.2.1" }
# The suite resolves its two fixture config homes through the *real*
# `AccountResolver`, which needs a `KeychainBackend` implementation, which is
# stated in `SecretString`. Stubbing the resolved environment instead would have
# made this ticket's central claim untestable.
secrecy = { workspace = true }
# The usage-probe tests write a fixture `auth.json` into a real directory, so the
# credential read is exercised against a filesystem rather than a stub of one.
tempfile = { workspace = true }
# The live probe's request path — header, status handling, body decode — proved
# against a recorded server rather than against the vendor.
wiremock = { workspace = true }
tokio = { workspace = true }
