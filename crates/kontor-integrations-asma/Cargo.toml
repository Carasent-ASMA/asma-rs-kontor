[package]
name = "kontor-integrations-asma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The asma jira sync subprocess boundary."

[lints]
workspace = true

[dependencies]
# The exact version is the workspace's own package version. A bare path
# dependency is a wildcard requirement, which `deny.toml` refuses.
#
# The domain policy types, the pure evaluator and the receipt shapes all come
# from `kontor-core`. This crate adds no DTO of its own for anything the core
# already models, and it deliberately has no HTTP client and no filesystem
# edge: every live effect crosses the `asma` executable boundary.
kontor-core = { path = "../kontor-core", version = "=0.2.0" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
