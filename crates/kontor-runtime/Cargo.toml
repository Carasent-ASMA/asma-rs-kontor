[package]
name = "kontor-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Adapter contract, capabilities and normalized events for agent runtimes."

[lints]
workspace = true

# No features. There was a `role-slot-permit` gate here, guarding an entry point
# that minted a `LaunchRequest` for `kontor-teams`. It was removed rather than
# tightened: Cargo unifies features per build, so any crate sharing a graph with
# `kontor-teams` got the gate open whether it asked or not, which made the gate a
# statement about the build rather than about authority. A launch is now
# authorized by `admission::LaunchAuthority`, which only a runtime can issue and
# only that runtime can redeem.

[dependencies]
# The exact version is the workspace's own package version. A bare path
# dependency is a wildcard requirement, which `deny.toml` refuses.
kontor-core = { path = "../kontor-core", version = "=0.1.0" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
