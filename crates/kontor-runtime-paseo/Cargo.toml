[package]
name = "kontor-runtime-paseo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Paseo CLI/API integration adapter for the Kontor control plane."

[lints]
workspace = true

[dependencies]
# The exact version is the workspace's own package version. A bare path
# dependency is a wildcard requirement, which `deny.toml` refuses.
kontor-core = { path = "../kontor-core", version = "=0.1.0" }
kontor-runtime = { path = "../kontor-runtime", version = "=0.1.0" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
# The CLI `--host` target carries a remote password in Paseo 0.2.5, so it is held
# in a zeroizing wrapper inside the transport and never crosses back out.
secrecy = { workspace = true }

# KON-MVP-11 deliberately declares no WebSocket client, exactly as
# `kontor-runtime-ao` deliberately declares none for AO's `/mux`. The daemon
# protocol's *semantics* — request-id correlation, canonical timeline paging,
# selective subscription, idempotent send, permission response — are implemented
# in `wire.rs` and driven through the `PaseoTransport` seam, so every acceptance
# criterion is proved against recorded frames. What is missing is only the socket
# that carries them, and opening one needs an exact workspace-pinned
# `tokio-tungstenite` that the root manifest does not carry. Adding that pin
# rewrites `Cargo.lock`, which KON-MVP-20 owns and this ticket must leave byte
# identical; and neither `tungstenite` nor `webpki-roots` is in the offline
# registry the workspace gates build against. Hand-rolled framing to dodge that
# gate is rejected outright (ALT-006). See `client::PaseoDaemonTransport`.

[dev-dependencies]
# The capability-aware shared contract, so this adapter is judged by the same
# assertions as the scripted fake and the AO adapter rather than by a copy of
# them. The dependency runs test-crate -> adapter only in this direction.
kontor-tests-contract = { path = "../../tests/contract", version = "=0.1.0" }
