[package]
name = "kontor-runtime-paseo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Paseo CLI/API integration adapter for the Kontor control plane."

[lints]
workspace = true

[dependencies]
# The exact version is the workspace's own package version. A bare path
# dependency is a wildcard requirement, which `deny.toml` refuses.
kontor-core = { path = "../kontor-core", version = "=0.2.1" }
kontor-runtime = { path = "../kontor-runtime", version = "=0.2.1" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Refusals on the restore path are named in the log rather than only in a
# return value: a binding this runtime declines to attest must be visible.
tracing = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
# The CLI `--host` target carries a remote password, so it is held in a
# zeroizing wrapper inside the transport and never crosses back out.
secrecy = { workspace = true }

# The Paseo 0.3.1 session socket. `connect` only: the qualified endpoint is
# plaintext loopback, so no TLS feature is enabled and no trust-anchor crate
# (`webpki-roots`) enters this adapter's graph. Hand-rolled framing to avoid the
# dependency gate is rejected outright (ALT-006).
tokio-tungstenite = { workspace = true }
# The daemon's MCP facade is the one Paseo surface that can rename a workspace,
# and it is plain HTTP on the same loopback port as the session socket. Already a
# workspace dependency; no new package enters the graph for it.
reqwest = { workspace = true }
# `SinkExt`/`StreamExt` and the split halves the reader task owns. Already a
# workspace dependency; no new package enters the graph for it.
futures = { workspace = true }

[dev-dependencies]
# The capability-aware shared contract, so this adapter is judged by the same
# assertions as the scripted fake and the AO adapter rather than by a copy of
# them. The dependency runs test-crate -> adapter only in this direction.
kontor-tests-contract = { path = "../../tests/contract", version = "=0.2.1" }
tempfile = { workspace = true }
