[package]
name = "kontor-scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Ready-set planning, durable leases, budgets and explanations."

[lints]
workspace = true

[dependencies]
kontor-core = { path = "../kontor-core", version = "=0.1.0" }
# KON-MVP-09: the module-isolation rule is decided in `kontor-policy` and called
# from here rather than restated, so a scheduler's answer and a guardrail's answer
# cannot drift apart.
kontor-policy = { path = "../kontor-policy", version = "=0.1.0" }
# The runtime capability, trust-grade and limit vocabulary a launch is admitted
# against. This crate consumes those values; it never contacts a runtime.
kontor-runtime = { path = "../kontor-runtime", version = "=0.1.0" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
jiff = { workspace = true }
thiserror = { workspace = true }
