[package]
name = "kontor-context"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Context Pack resolution, canonical hashing and portable handoffs."

[lints]
workspace = true

[dependencies]
# Canonical JSON, SHA-256, realm envelopes, sensitive scanning and every id are
# `kontor-core`'s; this crate never recreates them, so the scaffold's direct
# sha2/hex/uuid/thiserror pins are gone.
kontor-core = { path = "../kontor-core", version = "=0.2.1" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Integration tests link the crate, not its dependencies.
kontor-core = { path = "../kontor-core", version = "=0.2.1" }
serde_json = { workspace = true }
