# cargo-deny configuration for the Kontor workspace (KON-MVP-02).
# Schema target: cargo-deny 0.20+ (see the upstream deny.toml template).
# Exact dependency pins live in Cargo.toml [workspace.dependencies];
# this file only gates licenses, bans and advisories.
[graph]
# cargo-deny runs over the tier-1 desktop targets we support
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
# glib VariantStrIter unsoundness (RUSTSEC-2024-0429): affects glib <0.20.
# The Tauri 2 desktop shell pins the gtk-rs 0.18 tree (glib 0.18.5) and the
# affected iterator is never constructed by the scaffold; upstream fix requires
# glib >=0.20 which gtk-rs 0.18 cannot adopt. KON-MVP-17 re-evaluates when the
# desktop shell is implemented.
ignore = [
    "RUSTSEC-2024-0429",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
# High confidence when inferring licenses from text
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]
exceptions = [
    # `arrayref` 0.3.10's build-only version probe downloads the public Web
    # PKI trust-root dataset. Keep the data license exception pinned to the
    # exact transitive packages instead of admitting it workspace-wide.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@0.26.11" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots@1.0.9" },
]
