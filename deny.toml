# cargo-deny configuration for the Kontor workspace (KON-MVP-02).
# Schema target: cargo-deny 0.20+ (see the upstream deny.toml template).
# Exact dependency pins live in Cargo.toml [workspace.dependencies];
# this file only gates licenses, bans and advisories.
[graph]
# cargo-deny runs over the tier-1 desktop targets we support
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
# glib VariantStrIter unsoundness (RUSTSEC-2024-0429): affects glib <0.20.
# The Tauri 2 desktop shell pins the gtk-rs 0.18 tree (glib 0.18.5) and the
# affected iterator is never constructed by the scaffold; upstream fix requires
# glib >=0.20 which gtk-rs 0.18 cannot adopt. KON-MVP-17 re-evaluates when the
# desktop shell is implemented.
#
# zip <9.0.0 extraction advisories (RUSTSEC-2026-0367, -0368, -0369): zip 3.0.0
# is a build dependency of utoipa-swagger-ui 9.0.2 (kontor-api). As of 2026-10-17
# no release reaches zip >=9.0.0: utoipa-swagger-ui 10.0.1 still requires
# zip ^8.6. The use is build-script only. (zip 8.6.0 via libsodium-sys-stable
# left the tree with Stronghold, ASMA-8645.) utoipa-swagger-ui never calls
# `ZipArchive::extract`, but its own loop
# copies each entry's raw Unix mode (`unix_mode()`, `fs::set_permissions`) into
# OUT_DIR, so it repeats the RUSTSEC-2026-0367 SUID/SGID behaviour. Residual
# risk: the input is the Swagger UI v5.17.14 archive from a pinned HTTPS GitHub
# URL, so only a compromised upstream archive, or a build environment that sets
# SWAGGER_UI_DOWNLOAD_URL, reaches it. That loop is utoipa-swagger-ui code, so
# re-check it when lifting.
# Owner: KR-13 (ASMA-8520, release candidate qualification). Review by
# 2026-11-16. Lift: utoipa-swagger-ui releases with zip >=9.0.0; upgrade it and
# remove these entries here and in .cargo/audit.toml (cargo deny then reports
# them as advisory-not-detected).
ignore = [
    "RUSTSEC-2024-0429",
    { id = "RUSTSEC-2026-0367", reason = "zip build-script use only; utoipa-swagger-ui copies raw entry modes (residual risk above); no release reaches zip >=9.0.0; owner KR-13 (ASMA-8520); review by 2026-11-16" },
    { id = "RUSTSEC-2026-0368", reason = "zip build-script use only; no release reaches zip >=9.0.0; owner KR-13 (ASMA-8520); review by 2026-11-16" },
    { id = "RUSTSEC-2026-0369", reason = "zip build-script use only; no release reaches zip >=9.0.0; owner KR-13 (ASMA-8520); review by 2026-11-16" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
# High confidence when inferring licenses from text
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]
