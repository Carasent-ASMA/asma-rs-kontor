# Publication branch and title identity (ASMA-8101 / ASMA-8103).
#
# Trusted-base design: `pull_request_target` runs this workflow from the
# default branch, the checker reads the current event metadata as data, and
# nothing from the PR head or merge commit is ever checked out or executed.
# The checker itself refuses any current base ref other than master, so the
# trigger keeps no base filter and retargeting stays observable via `edited`.
name: Publication branch and title identity

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: publication-branch-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  identity:
    name: asma/publication-branch-title
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact trusted base revision
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Evaluate the current branch and title
        env:
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/publication_branch_title.py
