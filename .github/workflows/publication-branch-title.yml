# Publication branch and title identity (ASMA-8101 / ASMA-8103).
#
# Trusted-source design: `pull_request_target` runs this workflow from the
# default branch; the checker, its project-config helper, the YAML reader and
# the kontor-core grammar source are fetched through the GitHub Contents API
# from the exact immutable workflow revision (`github.workflow_sha`) into the
# runner temp directory; nothing from the PR head or merge commit is ever
# fetched or executed. The trigger keeps no base filter so retargeting stays
# observable via `edited`.
#
# The project key, base branch and check name come from the selected YAML
# config folder. This workflow cannot read that folder, so it prefers the
# repository variables KONTOR_PROJECT_KEY, KONTOR_BASE_BRANCH and
# KONTOR_CHECK_NAME when all three are set and writes a temporary projection
# recording them as the source. Otherwise it reads the committed projection
# `.github/kontor-project.yml`, itself generated from the config folder.
# A `dependabot/` branch opened by `dependabot[bot]` is exempt from the branch
# and title grammar; PR_AUTHOR carries the PR author's login for that exemption.
name: Publication branch and title identity

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: publication-branch-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  identity:
    name: ${{ vars.KONTOR_CHECK_NAME || 'asma/publication-branch-title' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the trusted sources from the exact workflow revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKER_SOURCE_SHA: ${{ github.workflow_sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECKER_PATH: ${{ runner.temp }}/publication_branch_title.py
          PROJECT_HELPER_PATH: ${{ runner.temp }}/kontor_project.py
          YAML_HELPER_PATH: ${{ runner.temp }}/pack.py
          BRANCH_SOURCE_PATH: ${{ runner.temp }}/branch.rs
          COMMITTED_PROJECTION_PATH: ${{ runner.temp }}/kontor-project.yml
        run: |
          set -euo pipefail

          test "${#CHECKER_SOURCE_SHA}" -eq 40
          case "$CHECKER_SOURCE_SHA" in
            *[!0-9a-f]*) exit 1 ;;
          esac

          printf 'checker_source_sha=%s\n' "$CHECKER_SOURCE_SHA"
          printf 'event_base_sha=%s\n' "$EVENT_BASE_SHA"

          fetch() {
            source_path=$1
            target_path=$2
            curl --fail-with-body --silent --show-error --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github.raw+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/contents/${source_path}?ref=${CHECKER_SOURCE_SHA}" \
              --output "$target_path"
            test -s "$target_path"
          }

          fetch ".github/scripts/publication_branch_title.py" "$CHECKER_PATH"
          fetch "scripts/kontor_project.py" "$PROJECT_HELPER_PATH"
          fetch "scripts/pack.py" "$YAML_HELPER_PATH"
          fetch "crates/kontor-core/src/branch.rs" "$BRANCH_SOURCE_PATH"
          fetch ".github/kontor-project.yml" "$COMMITTED_PROJECTION_PATH"

      - name: Project the repository variables
        shell: bash
        env:
          KONTOR_PROJECT_KEY: ${{ vars.KONTOR_PROJECT_KEY }}
          KONTOR_BASE_BRANCH: ${{ vars.KONTOR_BASE_BRANCH }}
          KONTOR_CHECK_NAME: ${{ vars.KONTOR_CHECK_NAME }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          COMMITTED_PROJECTION: ${{ runner.temp }}/kontor-project.yml
          SELECTED_PROJECTION: ${{ runner.temp }}/selected-project.yml
        run: |
          set -euo pipefail

          if [ -z "$KONTOR_PROJECT_KEY" ] && [ -z "$KONTOR_BASE_BRANCH" ] \
            && [ -z "$KONTOR_CHECK_NAME" ]; then
            cp "$COMMITTED_PROJECTION" "$SELECTED_PROJECTION"
            printf 'project_source=committed-projection\n'
            exit 0
          fi

          for value in "$KONTOR_PROJECT_KEY" "$KONTOR_BASE_BRANCH" "$KONTOR_CHECK_NAME"; do
            if [ -z "$value" ]; then
              echo "repository variables must be all set or all empty" >&2
              exit 1
            fi
          done

          case "$KONTOR_PROJECT_KEY" in
            ''|[0-9]*|*[!A-Z0-9]*)
              echo "KONTOR_PROJECT_KEY must be uppercase letters" >&2
              exit 1
              ;;
          esac
          case "$KONTOR_BASE_BRANCH" in
            ''|*[!A-Za-z0-9._/-]*)
              echo "KONTOR_BASE_BRANCH contains unsupported characters" >&2
              exit 1
              ;;
          esac
          case "$KONTOR_CHECK_NAME" in
            ''|*[!A-Za-z0-9._/-]*)
              echo "KONTOR_CHECK_NAME contains unsupported characters" >&2
              exit 1
              ;;
          esac

          {
            printf '# Generated projection of repository variables.\n'
            printf 'schema_version: 1\n'
            printf 'generated:\n'
            printf '  source: repository-variables\n'
            printf '  source_revision: %s\n' "$WORKFLOW_SHA"
            printf '  variables: [KONTOR_PROJECT_KEY, KONTOR_BASE_BRANCH, KONTOR_CHECK_NAME]\n'
            printf 'project:\n'
            printf '  key: %s\n' "$KONTOR_PROJECT_KEY"
            printf '  forge:\n'
            printf '    base_branch: %s\n' "$KONTOR_BASE_BRANCH"
            printf '  check_runs: [%s]\n' "$KONTOR_CHECK_NAME"
          } > "$SELECTED_PROJECTION"
          printf 'project_source=repository-variables\n'

      - name: Evaluate the current branch and title
        shell: bash
        env:
          CHECKER_PATH: ${{ runner.temp }}/publication_branch_title.py
          KONTOR_CONFIG_FILE: ${{ runner.temp }}/selected-project.yml
          KONTOR_BRANCH_GRAMMAR_SOURCE: ${{ runner.temp }}/branch.rs
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 "$CHECKER_PATH"
