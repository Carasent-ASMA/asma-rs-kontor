name: Update asma-modules Pointer

# Advances this repository's gitlink in asma-modules after master moves, so the
# pointer is never carried by hand. The updater opens a PR in asma-modules and
# turns on auto-merge; it resolves which gitlink to move from that repository's
# .gitmodules, matching on this repository's coordinates.
#
# Deliberately runs no build and no tests. The `ci` workflow owns the gates and
# is disabled for now because the workspace gates are run locally; keeping the
# pointer job separate means it still works while `ci` is off, and re-enabling
# `ci` later does not couple a pointer update to a 19-minute test run.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update_pointer:
    name: Update Pointer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout shared pointer action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Carasent-ASMA/asma-workflows
          ref: master
          path: .github/_asma-workflows-action
          sparse-checkout: |
            .github/actions/update-submodule-pointer
            .github/scripts/update_submodule_pointer.py
            .github/scripts/github_pr_shared.py

      - name: Update asma-modules pointer
        uses: ./.github/_asma-workflows-action/.github/actions/update-submodule-pointer
        with:
          github-app-id: ${{ secrets.ASMA_POINTER_SYNC_APP_ID }}
          github-app-private-key: ${{ secrets.ASMA_POINTER_SYNC_APP_PRIVATE_KEY }}
          caller-repository: ${{ github.repository }}
          caller-sha: ${{ github.sha }}
          caller-ref-name: ${{ github.ref_name }}
