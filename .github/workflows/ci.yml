name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@ff581034fb69296c525e51afd68cb9823bfbe4ed # v2.65.8
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace

      - name: Dependency advisories
        run: cargo audit

      - name: License and ban checks
        run: cargo deny check

  console:
    name: Console gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.6.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      # The console's wire types are generated from the committed contract
      # document, and `kontor-api`'s own suite pins that document to what the
      # crate serves. This closes the remaining link: types regenerated from the
      # document must equal the ones committed, so a console can never compile
      # against a contract the realm stopped serving.
      - name: Generated API types match the contract document
        run: pnpm --filter kontor-console verify:api

      - name: Typecheck all packages
        run: pnpm -r typecheck

      - name: Test all packages
        run: pnpm -r test

      - name: Production dependency audit
        run: pnpm audit --prod
